<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th Birthday!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Indie+Flower&display=swap');

        body {
            font-family: 'Indie Flower', cursive;
            background-color: #fff9e8;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #c04b5c;
        }

        #upload-container {
            background: #ffebcd;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            margin: 20px auto;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #c04b5c;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #c04b5c;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #a03b4c;
        }

        #scrapbook {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            justify-content: center;
        }

        .entry {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            word-wrap: break-word;
        }

        img, video {
            max-width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>🎂 Happy 18th Birthday! 🎉</h1>

    <div id="upload-container">
        <textarea id="message" placeholder="Write your message..."></textarea>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button onclick="submitEntry()">Submit</button>
    </div>

    <div id="scrapbook"></div>

    <script>
        function loadEntries() {
            let entries = JSON.parse(localStorage.getItem("scrapbook")) || [];
            let scrapbook = document.getElementById("scrapbook");
            scrapbook.innerHTML = "";
            
            entries.forEach(entry => {
                let div = document.createElement("div");
                div.className = "entry";

                if (entry.message) {
                    let p = document.createElement("p");
                    p.innerText = entry.message;
                    div.appendChild(p);
                }

                if (entry.file && entry.fileType.startsWith("image/")) {
                    let img = document.createElement("img");
                    img.src = entry.file;
                    div.appendChild(img);
                } else if (entry.file && entry.fileType.startsWith("video/")) {
                    let video = document.createElement("video");
                    video.src = entry.file;
                    video.controls = true;
                    div.appendChild(video);
                }

                scrapbook.appendChild(div);
            });
        }

        function submitEntry() {
            let message = document.getElementById("message").value;
            let fileInput = document.getElementById("fileInput").files[0];

            let newEntry = { message: message, file: null, fileType: null };

            if (fileInput) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    newEntry.file = event.target.result;
                    newEntry.fileType = fileInput.type;
                    saveEntry(newEntry);
                };
                reader.readAsDataURL(fileInput);
            } else {
                saveEntry(newEntry);
            }
        }

        function saveEntry(entry) {
            let entries = JSON.parse(localStorage.getItem("scrapbook")) || [];
            entries.push(entry);
            localStorage.setItem("scrapbook", JSON.stringify(entries));
            loadEntries();
        }

        window.onload = loadEntries;
    </script>

</body>
</html>
